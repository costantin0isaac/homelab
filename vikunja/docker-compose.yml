services:
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    restart: unless-stopped
    user: "0"
    ports:
      - "3456:3456"
    env_file:
      - /home/isaac/docker-configs/.env
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: vikunja-postgres
      VIKUNJA_DATABASE_PORT: 5432
      VIKUNJA_DATABASE_USER: ${VIKUNJA_DB_USER}
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      VIKUNJA_DATABASE_DATABASE: ${VIKUNJA_DB_NAME}
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_DOMAIN}
      VIKUNJA_FRONTEND_URL: ${VIKUNJA_DOMAIN}
    volumes:
      - vikunja_files:/app/vikunja/files
    depends_on:
      - vikunja-postgres
    networks:
      - costantino-net

  vikunja-postgres:
    image: postgres:15-alpine
    container_name: vikunja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VIKUNJA_DB_USER}
      POSTGRES_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      POSTGRES_DB: ${VIKUNJA_DB_NAME}
    volumes:
      - vikunja_db:/var/lib/postgresql/data
    networks:
      - costantino-net

volumes:
  vikunja_files:
  vikunja_db:

networks:
  costantino-net:
    external: true
