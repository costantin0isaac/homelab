services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: unless-stopped
    network_mode: host
    env_file:
      - /home/isaac/docker-configs/.env
    environment:
      - CLOUDFLARE_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=vpn.costantino.es
      - PROXIED=false
      - IP6_PROVIDER=none
      - UPDATE_CRON=@every 5m