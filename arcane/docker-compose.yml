services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - /home/isaac/docker-configs:/home/isaac/docker-configs
    environment:
      - APP_URL=https://arcane.costantino.es
      - PROJECTS_DIRECTORY=/home/isaac/docker-configs
      - PUID=${ARCANE_PUID}
      - PGID=${ARCANE_PGID}
      - ENCRYPTION_KEY=${ARCANE_ENCRYPTION_KEY}
      - JWT_SECRET=${ARCANE_JWT_SECRET}
      - TZ=Europe/Madrid
    cgroup: host
    restart: unless-stopped
    healthcheck:
      test: ['CMD', './arcane', 'health', '--timeout', '2s']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - costantino-net

volumes:
  arcane-data:

networks:
  proxy:
    external: true