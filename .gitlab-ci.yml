stages:
  - validate
  - build
  - deploy

variables:
  REGISTRY: registry.gitlab.costantino.es
  # Fail the job if a container does not reach running/healthy instead of deploying silently.
  WAIT: "--wait --wait-timeout 180"
  STATUS_IMAGE: $REGISTRY/homelab/docker-configs/status-page

before_script:
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.costantino.es/".insteadOf "https://gitlab.costantino.es/"

# ============================================================
# HOST: docker (VM 103) — runner tag: docker-ubuntu
# ============================================================

validate:main:
  stage: validate
  tags:
    - docker-ubuntu
  rules:
    - changes:
        - docker/**/*
        - .gitlab-ci.yml
  script:
    - echo "Validating docker-compose files in docker/..."
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker/vikunja/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker/grafana/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker/prometheus/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker/pve-exporter/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker/cadvisor/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker/status-page/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker/stirling/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker/ai-stack/docker-compose.yml config > /dev/null
    - echo "✅ All compose files in docker/ are valid"
  variables:
    ENV_FILE: /home/isaac/docker-configs/.env

build:status-page:
  stage: build
  tags:
    - docker-ubuntu
  rules:
    - changes:
        - docker/status-page/**/*
  script:
    - echo "Building status-page image..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - docker build -t $STATUS_IMAGE:latest -t $STATUS_IMAGE:$CI_COMMIT_SHORT_SHA $CI_PROJECT_DIR/docker/status-page/
    - docker push $STATUS_IMAGE:latest
    - docker push $STATUS_IMAGE:$CI_COMMIT_SHORT_SHA
    - echo "✅ Published image"

deploy:main:
  stage: deploy
  tags:
    - docker-ubuntu
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - docker/**/*
        - .gitlab-ci.yml
  variables:
    # Sparse-checkout clone: only docker/ is materialized on disk.
    REPO_DIR: /home/isaac/docker-configs
    HOST_DIR: /home/isaac/docker-configs/docker
    ENV_FILE: /home/isaac/docker-configs/.env
  script:
    - "echo Deploying host: docker..."
    - sudo -u isaac git -C $REPO_DIR fetch origin
    - sudo -u isaac git -C $REPO_DIR reset --hard origin/main
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    # The repo is the source of truth for settings.yml; it is copied into the
    # volume on every deploy (searxng rewrites it at runtime, hence no bind mount).
    - docker volume create ai-stack_searxng-config
    - docker run --rm -v ai-stack_searxng-config:/dst -v $HOST_DIR/ai-stack/searxng:/src:ro alpine:3 cp /src/settings.yml /dst/settings.yml
    # ai-stack runs early: it releases host ports that later stacks may claim.
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/ai-stack/docker-compose.yml up -d --remove-orphans $WAIT
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/vikunja/docker-compose.yml up -d --remove-orphans $WAIT
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/grafana/docker-compose.yml up -d --remove-orphans $WAIT
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/prometheus/docker-compose.yml up -d --remove-orphans $WAIT
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/pve-exporter/docker-compose.yml up -d --remove-orphans $WAIT
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/status-page/docker-compose.yml up -d --remove-orphans $WAIT
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/cadvisor/docker-compose.yml up -d --remove-orphans $WAIT
    # TODO: stirling-pdf is unhealthy; no $WAIT and excluded from verification until fixed.
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/stirling/docker-compose.yml up -d --remove-orphans
    - |
      echo "Verifying deployed containers on docker..."
      # name:published-host-port — empty port means "running is enough" (no host binding)
      EXPECTED="vikunja:3456 vikunja-postgres: grafana:3000 prometheus:9090
                pve-exporter:9221 status-page:3003 cadvisor:
                searxng:3002 open-webui:3001"
      # stirling-pdf:8081 intentionally omitted — unhealthy, see TODO above.
      failed=0
      for entry in $EXPECTED; do
        name="${entry%%:*}"; port="${entry##*:}"
        state=$(docker inspect -f '{{.State.Status}}' "$name" 2>/dev/null || echo missing)
        if [ "$state" != "running" ]; then
          echo "❌ $name: expected running, got $state"; failed=1; continue
        fi
        if [ -n "$port" ] && ! docker port "$name" 2>/dev/null | grep -qE ":${port}\$"; then
          echo "❌ $name: running but host port $port is not published (stale container?)"
          docker port "$name" 2>/dev/null | sed 's/^/     /'
          failed=1; continue
        fi
        echo "✅ $name${port:+ (:$port)}"
      done
      [ "$failed" -eq 0 ] || { echo "Deploy verification FAILED (host: docker)"; exit 1; }
    - echo "✅ Deploy completed on docker"

# ============================================================
# HOST: docker-core (VM 109) — runner tag: docker-core
# ============================================================

validate:core:
  stage: validate
  tags:
    - docker-core
  rules:
    - changes:
        - docker-core/**/*
        - .gitlab-ci.yml
  script:
    - echo "Validating docker-compose files in docker-core/..."
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker-core/caddy/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker-core/cloudflare-ddns/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker-core/arcane/docker-compose.yml config > /dev/null
    - docker compose --env-file $ENV_FILE -f $CI_PROJECT_DIR/docker-core/ntfy/docker-compose.yml config > /dev/null
    - echo "✅ All compose files in docker-core/ are valid"
  variables:
    ENV_FILE: /home/isaac/docker-core/.env

deploy:core:
  stage: deploy
  tags:
    - docker-core
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - docker-core/**/*
        - .gitlab-ci.yml
  variables:
    # Sparse-checkout clone: only docker-core/ is materialized on disk.
    REPO_DIR: /home/isaac/docker-core
    HOST_DIR: /home/isaac/docker-core/docker-core
    ENV_FILE: /home/isaac/docker-core/.env
  script:
    - "echo Deploying host: docker-core..."
    # The before_script rewrite lives in gitlab-runner's global config; this
    # fetch runs as isaac, so the token is passed inline.
    - sudo -u isaac git -C $REPO_DIR -c url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.costantino.es/".insteadOf="https://gitlab.costantino.es/" fetch origin
    - sudo -u isaac git -C $REPO_DIR reset --hard origin/main
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/caddy/docker-compose.yml up -d --remove-orphans $WAIT
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/cloudflare-ddns/docker-compose.yml up -d --remove-orphans $WAIT
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/arcane/docker-compose.yml up -d --remove-orphans $WAIT
    - docker compose --env-file $ENV_FILE -f $HOST_DIR/ntfy/docker-compose.yml up -d --remove-orphans $WAIT
    - |
      echo "Verifying deployed containers on docker-core..."
      EXPECTED="caddy:80 caddy:443 cloudflare-ddns: arcane:"
      failed=0
      for entry in $EXPECTED; do
        name="${entry%%:*}"; port="${entry##*:}"
        state=$(docker inspect -f '{{.State.Status}}' "$name" 2>/dev/null || echo missing)
        if [ "$state" != "running" ]; then
          echo "❌ $name: expected running, got $state"; failed=1; continue
        fi
        if [ -n "$port" ] && ! docker port "$name" 2>/dev/null | grep -qE ":${port}\$"; then
          echo "❌ $name: running but host port $port is not published (stale container?)"
          docker port "$name" 2>/dev/null | sed 's/^/     /'
          failed=1; continue
        fi
        echo "✅ $name${port:+ (:$port)}"
      done
      [ "$failed" -eq 0 ] || { echo "Deploy verification FAILED (host: docker-core)"; exit 1; }
    - echo "✅ Deploy completed on docker-core"