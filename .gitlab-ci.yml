stages:
  - validate
  - deploy

variables:
  DOCKER_DIR: /home/isaac/docker-configs

before_script:
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.costantino.es/".insteadOf "https://gitlab.costantino.es/"

# --- STAGE 1: VALIDATE ---
validate:
  stage: validate
  tags:
    - docker-ubuntu
  script:
    - echo "Validating docker-compose files..."
    - docker compose -f $DOCKER_DIR/vikunja/docker-compose.yml config > /dev/null
    - docker compose -f $DOCKER_DIR/caddy/docker-compose.yml config > /dev/null
    - docker compose -f $DOCKER_DIR/grafana/docker-compose.yml config > /dev/null
    - docker compose -f $DOCKER_DIR/prometheus/docker-compose.yml config > /dev/null
    - docker compose -f $DOCKER_DIR/pve-exporter/docker-compose.yml config > /dev/null
    - echo "✅All compose files are valid"

# --- STAGE 2: DEPLOY ---
deploy:
  stage: deploy
  tags:
    - docker-ubuntu
  script:
    - echo "Deploying changes..."
    - cd $DOCKER_DIR
    - git pull origin main
    - docker compose -f caddy/docker-compose.yml up -d --remove-orphans
    - docker compose -f vikunja/docker-compose.yml up -d --remove-orphans
    - docker compose -f grafana/docker-compose.yml up -d --remove-orphans
    - docker compose -f prometheus/docker-compose.yml up -d --remove-orphans
    - docker compose -f pve-exporter/docker-compose.yml up -d --remove-orphans
    - echo "✅Deploy completed"
  only:
    - main
