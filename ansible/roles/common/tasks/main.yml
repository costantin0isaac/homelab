- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install base packages
  apt:
    name:
      - curl
      - git
      - gnupg
      - lsb-release
      - python3-pip
    state: present
  become: yes

- name: Configure timezone
  timezone:
    name: Europe/Madrid
  become: yes