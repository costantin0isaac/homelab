- name: Clone repository
  git:
    repo: "{{ gitlab_repo }}"
    dest: "{{ docker_dir }}"
    version: main
    accept_hostkey: yes
    force: yes
  become: yes
  become_user: "{{ main_user }}"

- name: Create .env from ansible vault
  template:
    src: env.j2
    dest: "{{ docker_dir }}/.env"
    owner: "{{ main_user }}"
    group: "{{ main_user }}"
    mode: '0600'
  become: yes

- name: Create symlinks
  file:
    src: "{{ docker_dir }}/.env"
    dest: "{{ docker_dir }}/{{ item }}/.env"
    state: link
    force: yes
  loop:
    - caddy
    - vikunja
    - grafana
    - prometheus
    - pve-exporter
    - cadvisor
    - status-page
    - stirling
  become: yes
  become_user: "{{ main_user }}"

- name: Docker hub login
  command: docker login -u {{ vault_dockerhub_user }} -p {{ vault_dockerhub_token }}
  become: yes
  become_user: "{{ main_user }}"
  no_log: true

- name: Gitlab registry login
  command: docker login {{ vault_gitlab_registry_host }} -u {{ vault_gitlab_deploy_user }} -p {{ vault_gitlab_deploy_token }}
  become: yes
  become_user: "{{ main_user }}"
  no_log: true

- name: Start docker services
  command: >
    docker compose
    --env-file {{ docker_dir }}/.env
    -f {{ docker_dir }}/{{ item }}/docker-compose.yml
    up -d --remove-orphans
  loop:
    - vikunja
    - grafana
    - prometheus
    - pve-exporter
    - cadvisor
    - status-page
    - stirling
    - caddy
  become: yes
  become_user: "{{ main_user }}"
  register: compose_output

- name: Show deploy results
  debug:
    msg: "{{ compose_output.results | map(attribute='stdout_lines') | list }}"