- name: Setup Homelab
  hosts: docker_hosts
  become: yes

  roles:
  - common
  - docker
  - homelab

  post_tasks:
    - name: Verify docker running
      command: docker ps
      become_user: "{{ main_user }}"
      register: docker_ps_output
    - name: Show active containers
      debug:
        msg: "{{ docker_ps_output.stdout_lines }}"