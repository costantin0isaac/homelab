services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.costantino.es/
      GF_SECURITY_ADMIN_PASSWORD:
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_storage:/var/lib/grafana
    networks:
      - costantino-net

volumes:
  grafana_storage:

networks:
  costantino-net:
    external: true
